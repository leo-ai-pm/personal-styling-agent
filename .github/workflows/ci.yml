name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s m2/tests -p 'test_*.py'
      - run: python -m m2.item_cart_matrix --output reports/cart-matrix.json
      - run: python scripts/generate_sample_assets.py && git diff --exit-code -- data
      - run: python scripts/audit_publication.py
